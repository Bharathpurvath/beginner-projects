<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes App</title><link rel="stylesheet" href="../shared.css"><body><main class="app-shell"><nav class="topbar"><a class="brand" href="../index.html">BB / PROJECT 08</a><span>Saved in browser</span></nav><header class="hero"><p class="eyebrow">CRUD · SEARCH · LOCALSTORAGE</p><h1>Notes that stay yours.</h1><p>Create, edit, search and delete saved notes.</p></header><div class="stack"><section class="surface"><form id="form" class="fields"><input id="id" type="hidden"><label class="field wide">Title<input id="title" required maxlength="90"></label><label class="field wide">Note<textarea id="body" required maxlength="4000"></textarea></label><div class="actions wide"><button id="save" class="btn">Save note</button><button id="cancel" class="btn secondary" type="button" hidden>Cancel</button></div></form></section><section class="surface"><label class="field">Search<input id="search" type="search" placeholder="Search notes"></label><div id="notes" class="cards" style="margin-top:14px"></div><p id="empty" class="empty">No notes yet.</p></section></div></main><script>
const $=s=>document.querySelector(s),f=$("#form"),out=$("#notes");let notes=JSON.parse(localStorage.getItem("notes")||"[]");function render(){out.replaceChildren();const q=$("#search").value.toLowerCase();const arr=notes.filter(n=>(n.title+" "+n.body).toLowerCase().includes(q));arr.forEach(n=>{const c=document.createElement("article");c.className="result";const h=document.createElement("h3"),p=document.createElement("p"),a=document.createElement("div");h.textContent=n.title;p.textContent=n.body;a.className="actions";const edit=document.createElement("button");edit.className="btn secondary";edit.textContent="Edit";edit.onclick=()=>{$("#id").value=n.id;$("#title").value=n.title;$("#body").value=n.body;$("#save").textContent="Update";$("#cancel").hidden=false};const del=document.createElement("button");del.className="btn danger";del.textContent="Delete";del.onclick=()=>{notes=notes.filter(x=>x.id!==n.id);save()};a.append(edit,del);c.append(h,p,a);out.append(c)});$("#empty").hidden=arr.length>0}function save(){localStorage.setItem("notes",JSON.stringify(notes));render()}f.onsubmit=e=>{e.preventDefault();const old=notes.find(n=>n.id===$("#id").value);if(old){old.title=$("#title").value.trim();old.body=$("#body").value.trim()}else notes.unshift({id:crypto.randomUUID(),title:$("#title").value.trim(),body:$("#body").value.trim()});f.reset();$("#id").value="";$("#save").textContent="Save note";$("#cancel").hidden=true;save()};$("#cancel").onclick=()=>{f.reset();$("#id").value="";$("#save").textContent="Save note";$("#cancel").hidden=true};$("#search").oninput=render;render();
</script></body></html>
