<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Search</title><link rel="stylesheet" href="../shared.css"><body><main class="app-shell"><nav class="topbar"><a class="brand" href="../index.html">BB / PROJECT 10</a><span>TVMaze public API</span></nav><header class="hero"><p class="eyebrow">API · JSON · DYNAMIC UI</p><h1>Find a show to watch.</h1><p>Search TVMaze. Internet access required; no API key needed.</p></header><section class="surface stack"><form id="form" class="inline"><label class="field" style="flex:1">Show name<input id="q" required placeholder="The Office"></label><button class="btn">Search</button></form><p id="status" class="status">Search for a show.</p><div id="results" class="cards"></div></section></main><script>
const $=s=>document.querySelector(s),out=$("#results"),st=$("#status");$("#form").onsubmit=async e=>{e.preventDefault();out.replaceChildren();st.className="status";st.textContent="Searching…";try{const r=await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent($("#q").value.trim()));if(!r.ok)throw Error("Search service error.");const data=await r.json();if(!data.length){st.textContent="No shows found.";return}st.textContent=data.length+" result(s).";data.slice(0,18).forEach(({show})=>{const c=document.createElement("article");c.className="result";if(show.image?.medium){const im=document.createElement("img");im.src=show.image.medium;im.alt="";im.loading="lazy";c.append(im)}const h=document.createElement("h3"),p=document.createElement("p"),sum=document.createElement("p"),a=document.createElement("a");h.textContent=show.name;p.textContent=[show.premiered?.slice(0,4),show.genres?.join(" · "),show.status].filter(Boolean).join(" · ");sum.textContent=new DOMParser().parseFromString(show.summary||"","text/html").body.textContent||"No summary available.";a.href=show.url;a.target="_blank";a.rel="noopener noreferrer";a.className="link";a.textContent="Details ↗";c.append(h,p,sum,a);out.append(c)})}catch(err){st.className="status error";st.textContent=err.message+" Check internet."}};
</script></body></html>
