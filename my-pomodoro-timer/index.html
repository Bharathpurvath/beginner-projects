<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro Timer</title><link rel="stylesheet" href="../shared.css"><body><main class="app-shell" style="max-width:700px"><nav class="topbar"><a class="brand" href="../index.html">BB / PROJECT 13</a><span>Focus session</span></nav><header class="hero"><p class="eyebrow">TIMERS · STATE · NOTIFICATIONS</p><h1>Make room for focus.</h1><p>Focus for 25 minutes, then take a five-minute break.</p></header><section class="surface stack" style="text-align:center"><div class="actions"><button class="btn mode" data-mode="work">Focus · 25 min</button><button class="btn secondary mode" data-mode="break">Break · 5 min</button></div><div id="display" style="font-size:clamp(4rem,15vw,7rem);font-weight:800;font-variant-numeric:tabular-nums">25:00</div><p id="status" class="status">Ready when you are.</p><div class="actions"><button id="start" class="btn">Start</button><button id="pause" class="btn secondary">Pause</button><button id="reset" class="btn secondary">Reset</button></div><p>Completed focus sessions: <strong id="sessions">0</strong></p><label><input id="notify" type="checkbox"> Browser notification when timer ends</label></section></main><script>
const $=s=>document.querySelector(s),display=$("#display"),status=$("#status");let mode="work",left=1500,timer=null,sessions=Number(localStorage.getItem("pomodoro-sessions")||0);$("#sessions").textContent=sessions;function draw(){display.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")}function stop(){clearInterval(timer);timer=null}function choose(m){stop();mode=m;left=(m==="work"?25:5)*60;status.textContent=m==="work"?"Focus mode selected.":"Break mode selected.";draw();document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("secondary",b.dataset.mode!==m))}document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>choose(b.dataset.mode));$("#start").onclick=()=>{if(timer)return;status.textContent=mode==="work"?"Focus time.":"Enjoy your break.";timer=setInterval(()=>{left--;draw();if(left<=0){stop();left=0;draw();status.textContent="Time is up!";if(mode==="work"){sessions++;localStorage.setItem("pomodoro-sessions",sessions);$("#sessions").textContent=sessions}if($("#notify").checked&&"Notification"in window){if(Notification.permission==="granted")new Notification("Pomodoro timer",{body:"Your timer is complete."});else if(Notification.permission!=="denied")Notification.requestPermission().then(p=>{if(p==="granted")new Notification("Pomodoro timer",{body:"Your timer is complete."})})}}},1000)};$("#pause").onclick=()=>{stop();status.textContent="Paused."};$("#reset").onclick=()=>{stop();left=(mode==="work"?25:5)*60;status.textContent="Timer reset.";draw()};draw();
</script></body></html>
