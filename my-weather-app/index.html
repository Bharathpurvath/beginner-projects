<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather App</title><link rel="stylesheet" href="../shared.css"><body><main class="app-shell"><nav class="topbar"><a class="brand" href="../index.html">BB / PROJECT 07</a><span>Open-Meteo API</span></nav><header class="hero"><p class="eyebrow">REST API · FETCH · ASYNC/AWAIT</p><h1>Weather, anywhere.</h1><p>Search for current city conditions and a five-day forecast. Internet needed.</p></header><section class="surface stack"><form id="form" class="inline"><label class="field" style="flex:1">City<input id="city" required placeholder="Bengaluru"></label><button class="btn">Search</button></form><p id="status" class="status">Enter a city.</p><div id="out"></div></section><p class="footer">Open-Meteo · No API key required</p></main><script>
const $=s=>document.querySelector(s),st=$("#status"),out=$("#out"),desc=c=>c===0?"Clear":c<3?"Partly cloudy":c===3?"Overcast":c<50?"Fog":c<60?"Drizzle":c<70?"Rain":c<80?"Snow":c<90?"Showers":"Thunderstorm";$("#form").onsubmit=async e=>{e.preventDefault();st.className="status";st.textContent="Loading…";out.replaceChildren();try{const g=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent($("#city").value)+"&count=1&language=en&format=json")).json();if(!g.results?.length)throw Error("City not found.");const p=g.results[0],r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+p.latitude+"&longitude="+p.longitude+"&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5"),d=await r.json();const box=document.createElement("section");box.className="surface";box.innerHTML="<h2></h2><div class=stats><div class=stat><span>Temperature</span><strong>"+Math.round(d.current.temperature_2m)+"°</strong></div><div class=stat><span>Feels like</span><strong>"+Math.round(d.current.apparent_temperature)+"°</strong></div><div class=stat><span>Humidity</span><strong>"+d.current.relative_humidity_2m+"%</strong></div></div><p class=muted></p>";box.querySelector("h2").textContent=p.name+", "+p.country;box.querySelector("p").textContent=desc(d.current.weather_code)+" · Wind "+d.current.wind_speed_10m+" km/h";d.daily.time.forEach((day,i)=>{const q=document.createElement("p");q.className="result";q.textContent=new Date(day+"T12:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})+" · "+desc(d.daily.weather_code[i])+" · "+Math.round(d.daily.temperature_2m_min[i])+"° / "+Math.round(d.daily.temperature_2m_max[i])+"°";box.append(q)});out.append(box);st.textContent="Forecast updated."}catch(err){st.className="status error";st.textContent=err.message+" Check internet and try again."}};
</script></body></html>
