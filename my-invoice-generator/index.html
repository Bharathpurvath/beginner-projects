<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Generator</title><link rel="stylesheet" href="../shared.css"><style>.paper{background:#fff;color:#18202d;padding:28px;border-radius:12px}.paper table{width:100%;border-collapse:collapse;margin:16px 0}.paper th,.paper td{text-align:left;border-bottom:1px solid #ddd;padding:9px}.paper th:last-child,.paper td:last-child{text-align:right}.totals{margin-left:auto;width:min(100%,260px)}.totals p{display:flex;justify-content:space-between}@media print{body{background:#fff}.no-print{display:none}.app-shell{width:100%;padding:0}.paper{box-shadow:none}}</style><body><main class="app-shell"><nav class="topbar no-print"><a class="brand" href="../index.html">BB / PROJECT 15</a><span>Print-ready invoice</span></nav><header class="hero no-print"><p class="eyebrow">FORMS · CALCULATIONS · DYNAMIC UI</p><h1>Create a simple invoice.</h1><p>Enter details and print or save as PDF.</p></header><section class="surface stack no-print"><div class="fields"><label class="field">Your business<input id="business" placeholder="Bharath B"></label><label class="field">Client<input id="client" placeholder="Client name"></label><label class="field">Invoice number<input id="number" value="INV-001"></label><label class="field">Date<input id="date" type="date"></label><label class="field">Tax (%)<input id="tax" type="number" min="0" max="100" value="0"></label></div><h2>Items</h2><div id="items" class="stack"></div><div class="actions"><button id="add" class="btn secondary">Add item</button><button id="print" class="btn">Print / Save PDF</button></div></section><section id="paper" class="paper" style="margin-top:16px"></section></main><script>
const $=s=>document.querySelector(s),items=$("#items"),paper=$("#paper");let rows=[{description:"Web development",quantity:1,rate:0}];$("#date").value=new Date().toISOString().slice(0,10);const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR"}).format(n),el=(tag,value)=>{const x=document.createElement(tag);x.textContent=value;return x};function inputs(){items.replaceChildren();rows.forEach((r,i)=>{const box=document.createElement("div");box.className="fields";box.innerHTML='<label class="field wide">Description<input data-k="description" data-i="'+i+'" value="'+r.description.replaceAll('"',"&quot;")+'"></label><label class="field">Qty<input type="number" min="0" data-k="quantity" data-i="'+i+'" value="'+r.quantity+'"></label><label class="field">Rate ₹<input type="number" min="0" step=".01" data-k="rate" data-i="'+i+'" value="'+r.rate+'"></label><button class="btn danger" data-del="'+i+'">Remove</button>';items.append(box)});items.querySelectorAll("input").forEach(x=>x.oninput=()=>{const r=rows[Number(x.dataset.i)];r[x.dataset.k]=x.dataset.k==="description"?x.value:Number(x.value)||0;draw()});items.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(rows.length>1){rows.splice(Number(b.dataset.del),1);inputs();draw()}})}function draw(){paper.replaceChildren();const head=document.createElement("div");head.className="toolbar";const a=document.createElement("div");a.append(el("p","INVOICE"),el("h1",$("#business").value||"Your Business"));const b=document.createElement("div");b.append(el("strong",$("#number").value),el("p",$("#date").value));head.append(a,b);paper.append(head,document.createElement("hr"),el("p","Bill to: "+($("#client").value||"Client name")));const table=document.createElement("table"),th=document.createElement("tr");["Description","Qty","Rate","Amount"].forEach(s=>th.append(el("th",s)));const thead=document.createElement("thead");thead.append(th);table.append(thead);const body=document.createElement("tbody");let sub=0;rows.forEach(r=>{const tr=document.createElement("tr"),sum=r.quantity*r.rate;sub+=sum;[r.description||"Item",r.quantity,money(r.rate),money(sum)].forEach(v=>tr.append(el("td",String(v))));body.append(tr)});table.append(body);paper.append(table);const tax=sub*(Number($("#tax").value)||0)/100,tot=document.createElement("div");tot.className="totals";tot.append(el("p","Subtotal: "+money(sub)),el("p","Tax: "+money(tax)),el("h2","Total: "+money(sub+tax)));paper.append(tot,el("p","Thank you for your business."))}$("#add").onclick=()=>{rows.push({description:"",quantity:1,rate:0});inputs();draw()};["business","client","number","date","tax"].forEach(k=>$("#"+k).oninput=draw);$("#print").onclick=()=>window.print();inputs();draw();
</script></body></html>
