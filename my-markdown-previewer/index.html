<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown Previewer</title><link rel="stylesheet" href="../shared.css"><style>.preview{min-height:260px;padding:18px;background:#0d121b;border:1px solid #2c3546;border-radius:12px;overflow-wrap:anywhere}.preview a{color:#c4b4ff}.preview pre,.preview code{background:#273044;border-radius:5px;padding:2px 5px}.preview pre{padding:12px;overflow:auto}</style><body><main class="app-shell"><nav class="topbar"><a class="brand" href="../index.html">BB / PROJECT 12</a><span>Live preview</span></nav><header class="hero"><p class="eyebrow">TEXT PROCESSING · DOM</p><h1>Write Markdown. See it live.</h1><p>Basic headings, emphasis, lists, links and code are supported.</p></header><section class="grid two"><div class="surface"><label class="field">Markdown<textarea id="source" rows="18" spellcheck="false"></textarea></label><div class="actions" style="margin-top:12px"><button id="sample" class="btn secondary" type="button">Example</button><button id="clear" class="btn danger" type="button">Clear</button></div></div><div class="surface"><h2>Preview</h2><div id="preview" class="preview"></div></div></section></main><script>
const $=s=>document.querySelector(s),src=$("#source"),preview=$("#preview"),bt=String.fromCharCode(96);function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}function inline(s){s=esc(s);s=s.replace(new RegExp(bt+"([^"+bt+"]+)"+bt,"g"),"<code>$1</code>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');return s}function render(){const lines=src.value.split(/\r?\n/),out=[];let list=false,code=false,codeLines=[];function close(){if(list){out.push("</ul>");list=false}}for(const line of lines){if(line.trim().startsWith(bt.repeat(3))){close();if(code){out.push("<pre><code>"+esc(codeLines.join("\n"))+"</code></pre>");code=false}else{code=true;codeLines=[]}continue}if(code){codeLines.push(line);continue}const h=line.match(/^(#{1,3})\s+(.+)$/);if(h){close();out.push("<h"+h[1].length+">"+inline(h[2])+"</h"+h[1].length+">");continue}if(/^\s*[-*]\s+/.test(line)){if(!list){out.push("<ul>");list=true}out.push("<li>"+inline(line.replace(/^\s*[-*]\s+/,""))+"</li>");continue}close();if(line.trim())out.push("<p>"+inline(line)+"</p>")}close();if(code)out.push("<pre><code>"+esc(codeLines.join("\n"))+"</code></pre>");preview.innerHTML=out.join("")||'<p class="muted">Your preview appears here.</p>'}src.value="# Hello!\\n\\nWrite bold, italic, or inline code.\\n\\n## Try a list\\n- One item\\n- Another item\\n\\n[Secure link](https://example.com)";src.oninput=render;$("#sample").onclick=()=>{src.value="# Example\\n\\nTry bold, italic, and code.\\n\\n- First\\n- Second";render()};$("#clear").onclick=()=>{src.value="";render()};render();
</script></body></html>
