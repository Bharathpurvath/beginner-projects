<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habit Tracker</title><link rel="stylesheet" href="../shared.css"><body><main class="app-shell"><nav class="topbar"><a class="brand" href="../index.html">BB / PROJECT 14</a><span>Daily progress</span></nav><header class="hero"><p class="eyebrow">DATES · STATE · LOCALSTORAGE</p><h1>Build a steady habit.</h1><p>Add habits, choose a date, and track completion. Data stays in this browser.</p></header><div class="stack"><section class="surface"><form id="form" class="inline"><label class="field" style="flex:1">New habit<input id="name" required maxlength="50" placeholder="Read 15 minutes"></label><button class="btn">Add habit</button></form></section><section class="surface stack"><div class="toolbar"><button id="prev" class="btn secondary">←</button><h2 id="month" style="margin:auto"></h2><button id="next" class="btn secondary">→</button></div><div id="calendar" class="grid" style="grid-template-columns:repeat(7,minmax(0,1fr));gap:6px"></div><p id="selected-label" class="muted"></p></section><section class="surface"><h2>Habits for selected day</h2><div id="habits"></div><p id="empty" class="empty">Add a habit above.</p></section></div></main><script>
const $=s=>document.querySelector(s);let d=JSON.parse(localStorage.getItem("habit-data")||'{"habits":[],"checks":{}}'),view=new Date(),selected=new Date();view.setDate(1);const key=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");function save(){localStorage.setItem("habit-data",JSON.stringify(d));render()}function cal(){const c=$("#calendar");c.replaceChildren();$("#month").textContent=view.toLocaleDateString(undefined,{month:"long",year:"numeric"});["S","M","T","W","T","F","S"].forEach(x=>{const h=document.createElement("span");h.className="small";h.style.textAlign="center";h.textContent=x;c.append(h)});for(let i=0;i<new Date(view.getFullYear(),view.getMonth(),1).getDay();i++)c.append(document.createElement("i"));for(let n=1;n<=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();n++){const dt=new Date(view.getFullYear(),view.getMonth(),n),b=document.createElement("button"),k=key(dt);b.className="btn "+(key(selected)===k?"":"secondary");b.textContent=n+(d.checks[k]?.length?" ✓":"");b.onclick=()=>{selected=dt;render()};c.append(b)}}function habits(){const out=$("#habits");out.replaceChildren();const k=key(selected),done=d.checks[k]||[];$("#selected-label").textContent="Selected: "+selected.toLocaleDateString();d.habits.forEach(h=>{const row=document.createElement("div");row.className="entry";const label=document.createElement("label"),cb=document.createElement("input");cb.type="checkbox";cb.checked=done.includes(h.id);cb.onchange=()=>{const a=d.checks[k]||[];d.checks[k]=cb.checked?[...a,h.id]:a.filter(x=>x!==h.id);save()};label.append(cb,document.createTextNode(" "+h.name));const del=document.createElement("button");del.className="btn danger";del.textContent="Delete";del.onclick=()=>{d.habits=d.habits.filter(x=>x.id!==h.id);Object.keys(d.checks).forEach(day=>d.checks[day]=d.checks[day].filter(x=>x!==h.id));save()};row.append(label,del);out.append(row)});$("#empty").hidden=!!d.habits.length}function render(){cal();habits()}$("#form").onsubmit=e=>{e.preventDefault();d.habits.push({id:crypto.randomUUID(),name:$("#name").value.trim()});$("#name").value="";save()};$("#prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};$("#next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};render();
</script></body></html>
