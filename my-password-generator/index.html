<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator</title><link rel="stylesheet" href="../shared.css"><body><main class="app-shell" style="max-width:750px"><nav class="topbar"><a class="brand" href="../index.html">BB / PROJECT 09</a><span>Runs on this device</span></nav><header class="hero"><p class="eyebrow">STRINGS · ARRAYS · RANDOMIZATION</p><h1>Generate a strong password.</h1><p>Generated locally in your browser; nothing is uploaded.</p></header><section class="surface stack"><label class="field">Length (8–64)<input id="length" type="number" min="8" max="64" value="18"></label><div class="grid two"><label><input id="lower" type="checkbox" checked> Lowercase</label><label><input id="upper" type="checkbox" checked> Uppercase</label><label><input id="numbers" type="checkbox" checked> Numbers</label><label><input id="symbols" type="checkbox"> Symbols</label></div><button id="generate" class="btn" type="button">Generate password</button><label class="field">Password<input id="output" readonly></label><div class="actions"><button id="copy" class="btn secondary" type="button">Copy password</button><span id="status" class="status"></span></div></section></main><script>
const $=s=>document.querySelector(s),o=$("#output"),st=$("#status"),pick=n=>{const x=new Uint32Array(1);crypto.getRandomValues(x);return x[0]%n};$("#generate").onclick=()=>{const len=Number($("#length").value),sets=[];if($("#lower").checked)sets.push("abcdefghijklmnopqrstuvwxyz");if($("#upper").checked)sets.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");if($("#numbers").checked)sets.push("0123456789");if($("#symbols").checked)sets.push("!@#$%^&*()-_=+[]{}?");if(len<8||len>64||!Number.isInteger(len)){st.textContent="Choose length 8 to 64.";return}if(!sets.length){st.textContent="Choose a character set.";return}let a=sets.map(s=>s[pick(s.length)]),pool=sets.join("");while(a.length<len)a.push(pool[pick(pool.length)]);for(let i=a.length-1;i;i--){const j=pick(i+1);[a[i],a[j]]=[a[j],a[i]]}o.value=a.join("");st.textContent="Generated. Store it safely."};$("#copy").onclick=async()=>{if(!o.value){st.textContent="Generate first.";return}try{await navigator.clipboard.writeText(o.value);st.textContent="Copied."}catch{o.select();st.textContent="Selected; press Ctrl+C."}};
</script></body></html>
