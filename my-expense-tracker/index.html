<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><link rel="stylesheet" href="../shared.css"><body><main class="app-shell"><nav class="topbar"><a class="brand" href="../index.html">BB / PROJECT 06</a><span>Local browser data</span></nav><header class="hero"><p class="eyebrow">FORMS · CALCULATIONS · LOCALSTORAGE</p><h1>Expense Tracker</h1><p>Track income and expenses. Entries stay in this browser.</p></header><section class="stats"><div class="stat"><span>Balance</span><strong id="bal">₹0</strong></div><div class="stat"><span>Income</span><strong id="inc">₹0</strong></div><div class="stat"><span>Expenses</span><strong id="exp">₹0</strong></div></section><section class="surface" style="margin-top:16px"><h2>Add transaction</h2><form id="form" class="fields"><label class="field wide">Description<input id="desc" required maxlength="60"></label><label class="field">Amount ₹<input id="amt" type="number" min=".01" step=".01" required></label><label class="field">Type<select id="type"><option>expense</option><option>income</option></select></label><label class="field wide">Date<input id="date" type="date" required></label><button class="btn wide">Add</button></form></section><section class="surface" style="margin-top:16px"><div class="toolbar"><h2 style="margin-right:auto">Transactions</h2><button id="clear" class="btn danger" type="button">Clear all</button></div><ul id="list" class="list"></ul><p id="empty" class="empty">No transactions yet.</p></section></main><script>
const $=s=>document.querySelector(s),f=$("#form"),l=$("#list"),e=$("#empty"),dt=$("#date");dt.value=new Date().toISOString().slice(0,10);let a=JSON.parse(localStorage.getItem("expenses")||"[]");const m=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR"}).format(n);function save(){localStorage.setItem("expenses",JSON.stringify(a));draw()}function draw(){l.replaceChildren();let i=0,x=0;a.forEach(t=>{t.type==="income"?i+=t.amount:x+=t.amount;const li=document.createElement("li");li.className="entry";const n=document.createElement("div");n.className="entry-main";n.innerHTML="<strong></strong><small class=small></small>";n.firstChild.textContent=t.desc;n.lastChild.textContent=t.date+" · "+t.type;const d=document.createElement("button");d.className="btn danger";d.textContent="Delete";d.onclick=()=>{a=a.filter(v=>v.id!==t.id);save()};li.append(n,document.createTextNode((t.type==="income"?"+":"−")+m(t.amount)),d);l.append(li)});$("#inc").textContent=m(i);$("#exp").textContent=m(x);$("#bal").textContent=m(i-x);e.hidden=!!a.length}f.onsubmit=v=>{v.preventDefault();a.unshift({id:crypto.randomUUID(),desc:$("#desc").value.trim(),amount:Number($("#amt").value),type:$("#type").value,date:dt.value});f.reset();dt.value=new Date().toISOString().slice(0,10);save()};$("#clear").onclick=()=>{if(a.length&&confirm("Clear all transactions?")){a=[];save()}};draw();
</script></body></html>
