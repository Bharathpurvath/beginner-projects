<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub Profile Finder</title><link rel="stylesheet" href="../shared.css"><body><main class="app-shell"><nav class="topbar"><a class="brand" href="../index.html">BB / PROJECT 11</a><span>GitHub public API</span></nav><header class="hero"><p class="eyebrow">FETCH · ASYNC/AWAIT · ERROR HANDLING</p><h1>Explore a GitHub profile.</h1><p>Find public profile details and recently updated repositories.</p></header><section class="surface stack"><form id="form" class="inline"><label class="field" style="flex:1">Username<input id="user" required placeholder="octocat"></label><button class="btn">Find profile</button></form><p id="status" class="status">Enter a username.</p><div id="profile"></div></section></main><script>
const $=s=>document.querySelector(s),out=$("#profile"),st=$("#status"),el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text)x.textContent=text;return x};$("#form").onsubmit=async e=>{e.preventDefault();out.replaceChildren();st.className="status";st.textContent="Loading…";try{const r=await fetch("https://api.github.com/users/"+encodeURIComponent($("#user").value.trim()));if(r.status===404)throw Error("Username not found.");if(!r.ok)throw Error("GitHub API error ("+r.status+").");const u=await r.json(),rr=await fetch(u.repos_url+"?sort=updated&per_page=6");if(!rr.ok)throw Error("Could not load repositories.");const repos=await rr.json(),card=el("article","surface"),head=el("div","inline"),img=el("img","");img.src=u.avatar_url;img.alt="";img.width=90;img.style.borderRadius="50%";head.append(img,el("h2","",u.name||u.login));card.append(head,el("p","muted","@"+u.login),el("p","",u.bio||"No bio provided."));const stats=el("div","stats");[[u.public_repos,"Repos"],[u.followers,"Followers"],[u.following,"Following"]].forEach(([v,k])=>{const s=el("div","stat");s.append(el("span","",k),el("strong","",String(v)));stats.append(s)});card.append(stats);const a=el("a","link","Open GitHub profile ↗");a.href=u.html_url;a.target="_blank";a.rel="noopener noreferrer";card.append(a,el("h3","","Recent repositories"));const ul=el("ul","list");repos.forEach(repo=>{const li=el("li","entry"),link=el("a","link",repo.name);link.href=repo.html_url;link.target="_blank";link.rel="noopener noreferrer";li.append(link,el("span","small",(repo.language||"Unknown")+" · ★ "+repo.stargazers_count));ul.append(li)});if(!repos.length)ul.append(el("li","empty","No public repositories."));card.append(ul);out.append(card);st.textContent="Profile loaded."}catch(err){st.className="status error";st.textContent=err.message+" Try again later if the API limit was reached."}};
</script></body></html>
