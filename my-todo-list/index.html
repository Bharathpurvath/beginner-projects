<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">YOUR DAY, IN FOCUS</p>
      <h1>My To Do List</h1>
      <p class="subtitle">Add a task and take it one step at a time.</p>
    </header>

    <form class="task-form">
      <label class="sr-only" for="task-input">New task</label>
      <input
        id="task-input"
        type="text"
        placeholder="What do you need to do?"
        autocomplete="off"
      >
      <button type="submit">Add task</button>
    </form>

    <p class="task-count" aria-live="polite">0 tasks</p>
    <ul class="task-list" aria-label="Tasks"></ul>
    <p class="empty-message">Nothing here yet. Add your first task above.</p>
  </main>
</body>
</html>
